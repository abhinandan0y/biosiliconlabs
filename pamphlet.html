<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%;
  background: #0d1117;
  font-family: 'Segoe UI', sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

.scene {
  width: 100%;
  perspective: 2000px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 16px;
}

.pamphlet {
  width: min(95vw, 1400px);
  aspect-ratio: 3 / 1.6;
  position: relative;
  transform-style: preserve-3d;
}

.panel {
  position: absolute;
  top: 0;
  width: 33.333%;
  height: 100%;
  transform-style: preserve-3d;
}

#panel-left  { left: 0;      transform-origin: right center; }
#panel-mid   { left: 33.333%; }
#panel-right { left: 66.666%; transform-origin: left center; }

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.face img {
  width: 100%;
  height: 100%;
  object-position: center;
  background: #000;
}
.face.back { transform: rotateY(180deg); }

.face::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 14px;
  background: linear-gradient(to right, transparent, rgba(0,0,0,0.25));
  pointer-events: none;
}
.face.back::after {
  right: auto; left: 0;
  background: linear-gradient(to left, transparent, rgba(0,0,0,0.25));
}

.state-closed #panel-right { transform: rotateY(-180deg); z-index: 10; }
.state-closed #panel-left  { transform: rotateY(180deg);  z-index: 5;  }
.state-closed #panel-mid   { z-index: 1; }

.state-half #panel-right { transform: rotateY(0deg); z-index: 10; transition: transform 0.7s cubic-bezier(.4,0,.2,1); }
.state-half #panel-left  { transform: rotateY(180deg); z-index: 5; }
.state-half #panel-mid   { z-index: 1; }

.state-open #panel-right { transform: rotateY(0deg); z-index: 3; }
.state-open #panel-left  { transform: rotateY(0deg); z-index: 3; }
.state-open #panel-mid   { z-index: 3; }

.pamphlet, .panel { transition: transform 0.75s cubic-bezier(.4,0,.2,1); }

/* Controls — normal flow, below the scene */
.controls-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 24px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: rgba(126,207,255,0.08);
  border: 1px solid rgba(126,207,255,0.3);
  color: #7ecfff;
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
button:hover { background: rgba(126,207,255,0.18); border-color: rgba(126,207,255,0.6); }
button.active { background: rgba(126,207,255,0.25); border-color: #7ecfff; }
button:disabled { opacity: 0.3; cursor: default; }

.status {
  color: rgba(126,207,255,0.5);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  min-height: 18px;
}

#lb {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 999;
  align-items: center;
  justify-content: center;
}
#lb.on { display: flex; }
#lb-x {
  position: fixed; top:16px; right:24px;
  color:#7ecfff; font-size:2rem; cursor:pointer;
  background:none; border:none; line-height:1;
}
@media (max-width: 768px) {
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;   /* 🔥 vertical center */
    align-items: center;
  }

  .scene {
    padding: 0;
  }

  .controls-wrap {
    padding-bottom: 0;
  }
}
</style>
</head>
<body>

<div class="scene">
  <div class="pamphlet" id="pam" style="transform-style:preserve-3d;">

    <div class="panel" id="panel-left">
      <div class="face front">
        <img src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_0_0.png">
      </div>
      <div class="face back">
        <img src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_1_0.png">
      </div>
    </div>

    <div class="panel" id="panel-mid">
      <div class="face front">
        <img src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_0_1.png">
      </div>
      <div class="face back">
        <img src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_1_1.png">
      </div>
    </div>

    <div class="panel" id="panel-right">
      <div class="face back">
        <img class="content" src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_1_2.png">
      </div>
      <div class="face front">
        <img src="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/images/panel_0_2.png">
      </div>
    </div>

  </div>
</div>

<!-- Controls sit below the pamphlet in normal document flow -->
<div class="controls-wrap">
  <div class="controls">
    <button id="btn-close" onclick="setState('closed')">⬛ Close</button>
    <button id="btn-open"  onclick="openStep()">▶ Open</button>
    <button id="btn-flip"  onclick="toggleFlip()" disabled>⟳ Flip</button>
<a href="https://raw.githubusercontent.com/abhinandan0y/biosiliconlabs/refs/heads/main/docs/Bio-Silicon_Labs-Pamphlet.pdf" target="_blank">
  <button style="font-weight:600;">PDF</button>
</a>
  </div>
  <div class="status" id="status">Closed — right panel on top (front cover)</div>
</div>

<div id="lb" onclick="closeLb()">
  <button id="lb-x" onclick="closeLb()">✕</button>
</div>

<script>
const pam = document.getElementById('pam');
let state = 'closed';
let flipped = false;

const statuses = {
  half:    'Opening — right panel unfolding…',
  open:    'Fully open — inside view. Flip to see outside.',
  flipped: 'Flipped — outside view.',
  closed:  'Closed — right panel on top (front cover)',
};

function setState(s) {
  state = s;
  pam.className = 'pamphlet';

  if (s === 'flipped') {
    pam.classList.add('state-open');
    pam.style.transform = 'rotateY(180deg)';
    flipped = true;
  } else {
    pam.classList.add('state-' + s);
    pam.style.transform = '';
    flipped = false;
  }

  document.getElementById('status').textContent = statuses[s] || '';
  document.getElementById('btn-flip').disabled = (s !== 'open' && s !== 'flipped');
  document.getElementById('btn-close').classList.toggle('active', s === 'closed');
  document.getElementById('btn-open').classList.toggle('active', s === 'open' || s === 'half');
  document.getElementById('btn-flip').classList.toggle('active', s === 'flipped');
}

function openStep() {
  if (state === 'closed') {
    setState('half');
    setTimeout(() => setState('open'), 800);
  } else {
    setState('open');
  }
}

function toggleFlip() {
  flipped ? setState('open') : setState('flipped');
}

function closeLb() { document.getElementById('lb').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

setState('closed');

window.addEventListener('load', () => {
  const img = document.querySelector('#panel-mid .face.front img');
  if (!img) return;
  img.addEventListener('load', () => {
    const ratio = img.naturalWidth / img.naturalHeight;
    document.querySelector('.pamphlet').style.aspectRatio = ratio * 3;
  });
});
</script>
</body>
</html>
